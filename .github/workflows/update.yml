name: update
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch news + AI digest
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          NEWSHUB_DATA: public/data
        run: node server.mjs --once
      - name: Commit data
        run: |
          rm -f public/data/log.txt public/data/*.tmp
          git config user.name svodka-bot
          git config user.email svodka-bot@users.noreply.github.com
          git add public/data
          git diff --cached --quiet || git commit -m "data $(date -u +%FT%TZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
